<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add your resume | Interview Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <div class="page-shell resume-page">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Interview Studio home">
                <span class="brand-mark">IS</span>
                <span>Interview Studio</span>
            </a>
            <span class="step-label"><span class="status-dot"></span>Step 2 of 3</span>
        </header>

        <main class="main-content">
            <section class="intro" aria-labelledby="resume-title">
                <p class="eyebrow">Personalize your session</p>
                <h1 id="resume-title">Bring your experience.</h1>
                <p class="intro-copy">Upload your resume so we can make your practice interview feel closer to the real thing.</p>
            </section>

            <section class="selection-panel upload-panel" aria-labelledby="upload-heading">
                <div class="panel-heading">
                    <div>
                        <p class="section-kicker">Your resume</p>
                        <h2 id="upload-heading">Add a resume to get started</h2>
                    </div>
                    <span class="required-label">Required</span>
                </div>

                <form id="resumeForm">
                    <label class="upload-zone" for="resumeFile" id="uploadZone">
                        <span class="upload-icon" aria-hidden="true">&#8593;</span>
                        <span class="upload-title" id="uploadTitle">Drop your resume here</span>
                        <span class="upload-description">or click to browse from your device</span>
                        <span class="upload-types">PDF, DOC, or DOCX · up to 10 MB</span>
                        <input id="resumeFile" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
                    </label>
                    <p id="resumeMessage" class="connection-message" role="status" aria-live="polite"></p>
                    <button id="uploadButton" class="continue-button upload-button" type="submit" disabled>
                        Upload resume <span aria-hidden="true">&#8594;</span>
                    </button>
                </form>
            </section>
        </main>

        <footer class="footer"><span>Interview Studio</span><span>Thoughtful practice, sharper answers.</span></footer>
    </div>
    <script src="/assets/resume.js"></script>
</body>
</html>
