<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AI Interview Session</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <a class="brand" href="/">
                <span class="brand-mark">IS</span>
                <span>Interview Studio</span>
            </a>
            <span class="step-label"><span class="status-dot"></span>Live Multimodal Session</span>
        </header>

        <main style="padding-top: 24px;">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>

            <div class="interview-layout">
                <!-- Left: Live Webcam & Video Recorder -->
                <div>
                    <div class="webcam-card">
                        <video id="webcamVideo" class="webcam-video" autoplay playsinline muted></video>
                        <div class="recording-badge" id="recordingBadge" hidden>
                            <span class="rec-dot"></span>
                            <span>REC</span>
                            <span class="timer-label" id="recordingTimer">00:00</span>
                        </div>
                    </div>

                    <div class="camera-controls">
                        <button type="button" id="startRecordBtn" class="btn btn-primary" style="flex: 1;">
                            🎥 Start Answer (Record Video)
                        </button>
                        <button type="button" id="stopRecordBtn" class="btn btn-secondary" style="flex: 1;" hidden>
                            ⏹ Finish Answer & Process
                        </button>
                    </div>

                    <div id="statusMessage" style="margin-top: 14px; font-size: 13px; color: var(--accent-cyan); min-height: 20px;"></div>
                </div>

                <!-- Right: Question Stepper & Answers -->
                <div class="card question-panel" id="questionCard">
                    <div>
                        <div class="question-header">
                            <span class="badge" id="questionTopic">Technical</span>
                            <span style="color: var(--text-muted); font-size: 13px;" id="questionNumber">Question 1 of 5</span>
                        </div>

                        <h3 class="question-title" id="questionText">Loading interview question...</h3>

                        <div id="transcriptBox" class="transcript-box" hidden></div>

                        <div style="margin-top: 20px;">
                            <label style="display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">TEXT BACKUP ANSWER (OPTIONAL):</label>
                            <textarea id="textAnswerInput" style="width: 100%; min-height: 90px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); padding: 12px; font-family: var(--font-sans); outline: none;" placeholder="Or type your response here..."></textarea>
                            <button type="button" id="saveTextBtn" class="btn btn-secondary" style="margin-top: 8px; width: 100%;">Save Text Answer</button>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                        <button type="button" id="prevQuestionBtn" class="btn btn-secondary">← Previous</button>
                        <button type="button" id="nextQuestionBtn" class="btn btn-secondary">Next Question →</button>
                    </div>

                    <div style="margin-top: 16px;">
                        <button type="button" id="finishInterviewBtn" class="btn btn-primary" style="width: 100%;" disabled>
                            Complete & Finish Interview →
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/state.js"></script>
    <script src="/assets/js/ui.js"></script>
    <script src="/assets/js/camera.js"></script>
    <script src="/assets/js/interview.js"></script>
</body>
</html>
